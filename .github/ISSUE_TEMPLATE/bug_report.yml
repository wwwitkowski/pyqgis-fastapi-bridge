name: 🐛 Bug Report
description: Report a bug in the code, QGIS plugin, or FastAPI backend.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 🛑 Problem Description
      description: What is not working, and what is the expected result?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 🔄 Steps to Reproduce
      description: How can this issue be reproduced?
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 📄 Logs / Error Output (Stack trace)
      placeholder: "Paste console or terminal error logs here..."
