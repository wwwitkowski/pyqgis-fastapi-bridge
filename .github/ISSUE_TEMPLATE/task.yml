name: 🚀 New Task / Feature
description: Propose a new task or feature for collaborative development.
title: "[TASK]: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        ### 📋 Task Specification (Issue-Driven Development)
        Use this template to define the work scope before writing code.
  - type: textarea
    id: goal
    attributes:
      label: 🎯 Task Goal (What are we building?)
      description: Concise description of the feature or problem to solve (1-3 sentences).
      placeholder: "e.g. Add a backend endpoint to fetch parcel boundaries in GeoJSON format from ULDK..."
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 📦 Affected Module
      description: Select the primary module impacted.
      options:
        - backend (FastAPI / Ingestion)
        - qgis_plugin (PyQGIS GUI / Task)
        - shared (Pydantic / Constants)
        - web (MapLibre GL JS)
        - docs (Registries / Documentation)
        - tests / devops
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 🛠️ Work Scope & Definition of Done (When is this task completed?)
      description: Short checklist of criteria to avoid ambiguity and scope creep.
      value: |
        - [ ] Step 1: ...
        - [ ] Step 2: ...
        - [ ] Verified locally
    validations:
      required: true
  - type: input
    id: assignee_note
    attributes:
      label: 👤 Assignee / Execution Assistant
      description: Who is responsible for completing this task (e.g. team member, AI assistant).
      placeholder: "e.g. Lead Dev + AI Assistant"
