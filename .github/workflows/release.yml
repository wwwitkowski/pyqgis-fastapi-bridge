name: Release QGIS Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run test suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Package QGIS Plugin ZIP
        run: |
          python package_plugin.py pyqgis_fastapi_bridge-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pyqgis_fastapi_bridge-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
