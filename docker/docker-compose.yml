services:
  # 1. Spatial Database (PostGIS)
  postgis:
    image: postgis/postgis:15-3.3
    container_name: spatial_postgis
    environment:
      POSTGRES_USER: gis_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: spatial_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  # 2. Dynamic Raster Tile Server (TiTiler)
  titiler:
    image: developmentseed/titiler:latest
    container_name: spatial_titiler
    environment:
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgis_data:
